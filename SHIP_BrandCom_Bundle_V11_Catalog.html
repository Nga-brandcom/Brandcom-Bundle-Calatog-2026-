<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMAX BrandCom Bundle Catalog V11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0000FF; --azure:#0080FF; --aqua:#00FFFF;
  --red:#FF0000; --vivid:#FF6000; --orange:#FFA500; --purple:#8B00FF;
  --ink:#0A0A2A; --muted:#5b5b74; --line:#e6e6ef; --bg:#ffffff; --soft:#f6f7fb;
  --tier1:#0000FF; --tier2:#FF6000; --tier3:#FF0000; --tier3p:#8B00FF;
  --radius:14px;
  --shadow:0 10px 30px -12px rgba(10,10,42,.18);
  --display:'Archivo','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
/* Brand display typeface (Archivo — PMAX primary) for logotype + headings.
   SemiExpanded look approximated with slight positive tracking. */
.logo .mark, .logo .tag, .appbar .titles h1,
.ov-head h2, .b-hero h2, .stat .n, .pr-sec h5, table.ov thead th, tr.tier-row td{
  font-family:var(--display);
}
.logo .mark, .b-hero h2, .ov-head h2{letter-spacing:.2px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Header ---------- */
header.appbar{
  position:sticky; top:0; z-index:50;
  background:#fff; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px; gap:20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px}
.logo-img{height:46px; width:auto; display:block}
.logo{display:flex; flex-direction:column; line-height:1}
.logo .mark{display:flex; align-items:flex-end; gap:2px; font-weight:800; font-size:30px; letter-spacing:-1px}
.logo .mark .p{color:var(--blue)}
.logo .mark svg{display:block}
.logo .mark .ax{color:var(--blue)}
.logo .tag{font-size:9px; font-weight:700; letter-spacing:3.5px; color:var(--blue); margin-top:3px}
.appbar .titles{border-left:2px solid var(--line); padding-left:16px}
.appbar .titles h1{font-size:16px; font-weight:700}
.appbar .titles p{font-size:12px; color:var(--muted)}
.appbar .meta{font-size:11px; color:var(--muted); text-align:right}
.appbar .meta b{color:var(--ink)}

/* ---------- Tabs ---------- */
nav.tabs{
  position:sticky; top:71px; z-index:40; background:#fff;
  border-bottom:1px solid var(--line);
  display:flex; gap:4px; padding:8px 18px; overflow-x:auto; scrollbar-width:thin;
}
nav.tabs::-webkit-scrollbar{height:6px}
nav.tabs::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.tab-btn{
  flex:0 0 auto; border:1px solid transparent; background:transparent;
  padding:7px 13px; border-radius:9px; font-family:inherit; font-size:12.5px;
  font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;
  transition:.15s; display:flex; align-items:center; gap:7px;
}
.tab-btn:hover{background:var(--soft); color:var(--ink)}
.tab-btn .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
.tab-btn.active{color:#fff}
.tab-btn.active[data-tier="1"]{background:var(--tier1)}
.tab-btn.active[data-tier="2"]{background:var(--tier2)}
.tab-btn.active[data-tier="3"]{background:var(--tier3)}
.tab-btn.active[data-tier="3p"]{background:var(--tier3p)}
.tab-btn.active[data-tier="ov"]{background:var(--ink)}

/* ---------- Layout ---------- */
main{max-width:1180px; margin:0 auto; padding:30px 26px 80px}
.panel{display:none; animation:fade .35s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ---------- Overview ---------- */
.ov-head{margin-bottom:22px}
.ov-head h2{font-size:26px; font-weight:800; letter-spacing:-.5px}
.ov-head p{color:var(--muted); font-size:14px; margin-top:4px}
.ov-stats{display:flex; gap:12px; flex-wrap:wrap; margin:20px 0 26px}
.stat{
  border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px;
  min-width:130px; background:var(--soft);
}
.stat .n{font-size:24px; font-weight:800}
.stat .l{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px}
.stat.t1 .n{color:var(--tier1)} .stat.t2 .n{color:var(--tier2)}
.stat.t3 .n{color:var(--tier3)} .stat.t3p .n{color:var(--tier3p)}

.toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.toolbar input, .toolbar select{
  font-family:inherit; font-size:13px; padding:9px 13px; border:1px solid var(--line);
  border-radius:9px; color:var(--ink); background:#fff; outline:none;
}
.toolbar input{min-width:240px; flex:1}
.toolbar input:focus, .toolbar select:focus{border-color:var(--azure)}
.toolbar .hint{font-size:11.5px; color:var(--muted)}

.tbl-wrap{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
table.ov{width:100%; border-collapse:collapse; font-size:13px}
table.ov thead th{
  background:var(--ink); color:#fff; text-align:left; padding:12px 14px;
  font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;
  cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0;
}
table.ov thead th:hover{background:#181848}
table.ov thead th .arw{opacity:.4; font-size:10px}
tr.tier-row td{
  padding:9px 14px; font-weight:800; font-size:12px; letter-spacing:.5px;
  text-transform:uppercase; color:#fff;
}
tr.tier-row.t1 td{background:var(--tier1)}
tr.tier-row.t2 td{background:var(--tier2)}
tr.tier-row.t3 td{background:var(--tier3)}
tr.tier-row.t3p td{background:var(--tier3p)}
table.ov tbody td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top}
table.ov tbody tr.data-row:hover{background:var(--soft)}
.sku-link{
  font-weight:700; color:var(--blue); cursor:pointer; font-variant-numeric:tabular-nums;
  text-decoration:none; border-bottom:1px dashed transparent;
}
.sku-link:hover{border-bottom-color:var(--blue)}
.bname{font-weight:600}
.badge{
  display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;
  white-space:nowrap;
}
.badge.role{background:#eef0ff; color:var(--blue)}
.st{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600}
.st .d{width:8px; height:8px; border-radius:50%}
.st.validated .d{background:#12b76a} .st.validated{color:#087a43}
.st.monitor .d{background:var(--orange)} .st.monitor{color:#b26a00}
.st.new .d{background:var(--red)} .st.new{color:var(--red)}
.vert{color:var(--muted); font-size:12.5px}

/* ---------- Bundle detail ---------- */
.b-hero{
  border-radius:var(--radius); padding:26px 28px; color:#fff; margin-bottom:22px;
  position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.b-hero[data-tier="1"]{background:linear-gradient(120deg,var(--blue),var(--azure))}
.b-hero[data-tier="2"]{background:linear-gradient(120deg,var(--vivid),var(--orange))}
.b-hero[data-tier="3"]{background:linear-gradient(120deg,var(--red),var(--vivid))}
.b-hero[data-tier="3p"]{background:linear-gradient(120deg,var(--purple),#c026d3)}
.b-hero .tierlabel{font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:.9}
.b-hero h2{font-size:27px; font-weight:800; margin:6px 0 4px; letter-spacing:-.5px}
.b-hero .sku{font-size:13px; font-weight:600; opacity:.92; font-variant-numeric:tabular-nums}
.b-hero .stdname{font-size:12.5px; opacity:.82; margin-top:8px; font-style:italic}

.infocard{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0;
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;
}
.infocard .cell{padding:14px 16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.infocard .cell .k{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted)}
.infocard .cell .v{font-size:14px; font-weight:600; margin-top:3px}

.components{
  border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:26px;
}
.components h4{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:10px}
.comp-bar{display:flex; height:30px; border-radius:8px; overflow:hidden; margin-bottom:12px}
.comp-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; min-width:34px}
.comp-list{display:flex; flex-wrap:wrap; gap:8px}
.comp-chip{font-size:12px; padding:4px 10px; border-radius:20px; background:var(--soft); border:1px solid var(--line); font-weight:600}
.comp-chip b{color:var(--blue)}

/* PR columns */
.pr-toggle{display:flex; gap:8px; margin-bottom:16px}
.pr-toggle button{
  font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 16px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer;
}
.pr-toggle button.active{background:var(--ink); color:#fff; border-color:var(--ink)}
.pr-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.pr-grid.single{grid-template-columns:1fr}
.pr-col{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.pr-col .col-head{
  padding:11px 18px; font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  color:#fff; display:flex; align-items:center; gap:8px;
}
.pr-col.vi .col-head{background:var(--blue)}
.pr-col.en .col-head{background:var(--vivid)}
.pr-col .col-body{padding:6px 20px 18px}
.pr-sec{padding:14px 0; border-bottom:1px solid var(--line)}
.pr-sec:last-child{border-bottom:none}
.pr-sec h5{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:7px; display:flex; align-items:center; gap:8px}
.pr-sec h5 .orig{font-weight:400; opacity:.6; font-size:11px; letter-spacing:0}
.pr-sec h5 .ic{
  width:22px; height:22px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center;
  font-size:12px; color:#fff; flex:0 0 auto;
}
.pr-col.vi .ic{background:var(--azure)} .pr-col.en .ic{background:var(--orange)}
.pr-sec p{font-size:13px; color:#2a2a44; margin-bottom:8px}
.pr-sec ul{list-style:none; margin:4px 0 8px}
.pr-sec ul li{font-size:12.8px; color:#2a2a44; padding-left:18px; position:relative; margin-bottom:6px}
.pr-sec ul li::before{content:"▸"; position:absolute; left:0; color:var(--azure); font-size:11px; top:1px}
.pr-col.en ul li::before{color:var(--vivid)}
.pr-sec .conseq{color:var(--red); font-style:italic; font-size:12px}
.quote{
  background:var(--soft); border-left:3px solid var(--blue); padding:12px 16px; border-radius:0 8px 8px 0;
  font-style:italic; font-size:13px; color:#2a2a44;
}
.pr-col.en .quote{border-left-color:var(--vivid)}
.quote .who{display:block; margin-top:8px; font-style:normal; font-weight:700; font-size:12px; color:var(--ink)}
.disclaim{font-size:11.5px; color:var(--orange); font-weight:600; margin-bottom:8px}

footer{border-top:1px solid var(--line); padding:24px 26px; text-align:center; color:var(--muted); font-size:12px}

/* ---------- Responsive ---------- */
@media(max-width:860px){
  .pr-grid{grid-template-columns:1fr}
  .appbar .titles{border-left:none; padding-left:0}
  .appbar .meta{display:none}
  main{padding:22px 16px 60px}
  table.ov{font-size:12px}
}

/* ---------- Print ---------- */
@media print{
  nav.tabs, .pr-toggle, .toolbar, .tab-btn{display:none !important}
  header.appbar{position:static; box-shadow:none}
  .panel{display:none !important}
  .panel.print-me{display:block !important}
  .pr-grid{grid-template-columns:1fr 1fr !important; gap:14px}
  .b-hero{-webkit-print-color-adjust:exact; print-color-adjust:exact; box-shadow:none}
  .pr-col .col-head, tr.tier-row td, table.ov thead th, .comp-seg{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{font-size:11px}
  .panel{page-break-after:always}
}
</style>
</head>

function buildTabs(){
  let html = `<button class="tab-btn active" data-tier="ov" data-target="ov"><span class="dot" style="background:#0A0A2A"></span>Overview</button>`;
  BUNDLES.forEach(b=>{
    html += `<button class="tab-btn" data-tier="${b.tier}" data-target="b${b.n}">
      <span class="dot" style="background:${TIERS[b.tier].dot}"></span>${b.sku}</button>`;
  });
  tabsEl.innerHTML = html;
}

function fmtKV(s){
  const i = s.indexOf(':');
  return i<0 ? s : '<b>'+s.slice(0,i+1)+'</b>'+s.slice(i+1);
}
// VN problem bullet: bold the title, red-italic the "Hậu quả:" consequence
function fmtProblem(s){
  let main=s, conseq='';
  const h=s.indexOf('Hậu quả:');
  if(h>=0){ main=s.slice(0,h).replace(/[.\s]+$/,'').trim(); conseq=s.slice(h+8).trim(); }
  const i=main.indexOf(':');
  const body = i<0 ? main : '<b>'+main.slice(0,i+1)+'</b>'+main.slice(i+1);
  return `<p>${body}${conseq?` <span class="conseq">→ Hậu quả: ${conseq}</span>`:''}</p>`;
}
function quoteBlock(q){
  const disc = q.disc ? `<div class="disclaim">⚠ ${q.disc}</div>` : '';
  return `${disc}<div class="quote">"${q.text}"<span class="who">${q.who}</span></div>`;
}
function prColumn(lang, b){
  const d = b[lang];
  const vi = lang==='vi';
  const head = vi ? '🇻🇳 Vietnamese Press Release' : '🇬🇧 English Press Release';
  let secs = '';
  // Overview
  secs += `<div class="pr-sec"><h5><span class="ic">${ICONS.ov}</span>${vi?'Tổng quan':'Overview'}</h5><p>${d.overview}</p></div>`;
  // Target Customers
  secs += `<div class="pr-sec"><h5><span class="ic">${ICONS.cust}</span>${vi?'Khách hàng mục tiêu':'Target Customers'}</h5><ul>${d.customers.map(c=>`<li>${fmtKV(c)}</li>`).join('')}</ul></div>`;
  // Problem — VN only (EN is the condensed executive version)
  if(vi && d.problems && d.problems.length){
    secs += `<div class="pr-sec"><h5><span class="ic">${ICONS.prob}</span>Vấn đề cần giải quyết</h5>${d.problems.map(fmtProblem).join('')}</div>`;
  }
  // PMAX Solution
  secs += `<div class="pr-sec"><h5><span class="ic">${ICONS.sol}</span>${vi?'Giải pháp PMAX':'PMAX Solution'}</h5><p>${d.solution}</p></div>`;
  // Testimonial
  const tHead = vi ? 'Nhận xét từ khách hàng'
                   : 'Client Testimonial <span class="orig">(Vietnamese original)</span>';
  secs += `<div class="pr-sec"><h5><span class="ic">${ICONS.quote}</span>${tHead}</h5>${quoteBlock(d.quote)}</div>`;

  return `<div class="pr-col ${lang}"><div class="col-head">${head}</div><div class="col-body">${secs}</div></div>`;
}

function bundlePanel(b){
  // component bar
  let bar='', chips='';
  b.components.forEach((c,i)=>{
    const col = COMP_COLORS[i%COMP_COLORS.length];
    bar += `<div class="comp-seg" style="background:${col}; width:${c.pct}%" title="${c.fn} ${c.pct}%">${c.pct}%</div>`;
    chips += `<span class="comp-chip"><b>${c.sku}</b> · ${c.fn} · ${c.pct}%</span>`;
  });
  const noteHtml = b.note ? `<div class="disclaim">⚠ ${b.note}</div>` : '';

  return `<section class="panel" id="panel-b${b.n}">
    <div class="b-hero" data-tier="${b.tier}">
      <div class="tierlabel">${TIERS[b.tier].label} · Bundle ${b.n} / 15</div>
      <h2>${b.name}</h2>
      <div class="sku">${b.sku} · ${b.combo}</div>
      <div class="stdname">Product Name Standard: ${b.stdName}</div>
    </div>

    ${noteHtml}

    <div class="infocard">
      <div class="cell"><div class="k">SKU Code</div><div class="v">${b.sku}</div></div>
      <div class="cell"><div class="k">Bundle Name</div><div class="v">${b.name}</div></div>
      <div class="cell"><div class="k">Function Combo</div><div class="v">${b.combo}</div></div>
      <div class="cell"><div class="k">Product Role</div><div class="v">${b.role}</div></div>
      <div class="cell"><div class="k">Tier</div><div class="v">${TIERS[b.tier].label}</div></div>
      <div class="cell"><div class="k">Recommended Verticals</div><div class="v">${b.verticals}</div></div>
      <div class="cell"><div class="k">Status</div><div class="v"><span class="st ${b.stType}"><span class="d"></span>${b.status}</span></div></div>
      <div class="cell"><div class="k">Solution / BU</div><div class="v">Branding · Enterprise</div></div>
    </div>

    <div class="components">
      <h4>Bundle Components — Revenue Split</h4>
      <div class="comp-bar">${bar}</div>
      <div class="comp-list">${chips}</div>
    </div>

    <div class="pr-toggle" data-b="${b.n}">
      <button data-mode="both" class="active">Both languages</button>
      <button data-mode="vi">Tiếng Việt</button>
      <button data-mode="en">English</button>
    </div>

    <div class="pr-grid" id="prgrid-${b.n}">
      ${prColumn('vi',b)}
      ${prColumn('en',b)}
    </div>
  </section>`;
}

function render(){
  buildTabs();
  let html = overviewPanel();
  BUNDLES.forEach(b=> html += bundlePanel(b));
  main.innerHTML = html;
  document.getElementById('pf').textContent = new Date().getFullYear() + ' · ' + BUNDLES.length + ' bundles';
  wire();
}

/* ---- Interactions ---- */
function switchTab(target){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.toggle('active', t.dataset.target===target));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('panel-'+target);
  if(panel) panel.classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function wire(){
  // tab clicks
  tabsEl.addEventListener('click', e=>{
    const btn = e.target.closest('.tab-btn');
    if(btn) switchTab(btn.dataset.target);
  });
  // sku links -> goto bundle
  main.addEventListener('click', e=>{
    const link = e.target.closest('[data-goto]');
    if(link){ switchTab(link.dataset.goto); }
    // pr toggle
    const tg = e.target.closest('.pr-toggle button');
    if(tg){
      const wrap = tg.parentElement;
      wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      tg.classList.add('active');
      const grid = document.getElementById('prgrid-'+wrap.dataset.b);
      const mode = tg.dataset.mode;
      const vi = grid.querySelector('.pr-col.vi');
      const en = grid.querySelector('.pr-col.en');
      grid.classList.toggle('single', mode!=='both');
      vi.style.display = (mode==='both'||mode==='vi')?'':'none';
      en.style.display = (mode==='both'||mode==='en')?'':'none';
    }
  });

  // filtering
  const search = document.getElementById('ovSearch');
  const tierSel = document.getElementById('ovTier');
  const statusSel = document.getElementById('ovStatus');
  const countEl = document.getElementById('ovCount');
  function applyFilter(){
    const q = search.value.trim().toLowerCase();
    const t = tierSel.value, s = statusSel.value;
    let shown=0;
    document.querySelectorAll('#ovBody tr.data-row').forEach(r=>{
      const okQ = !q || r.dataset.search.includes(q);
      const okT = !t || r.dataset.tier===t;
      const okS = !s || r.dataset.status.includes(s);
      const vis = okQ&&okT&&okS;
      r.style.display = vis?'':'none';
      if(vis) shown++;
    });
    // tier headers: hide if no visible rows under them
    document.querySelectorAll('#ovBody tr.tier-row').forEach(h=>{
      const t2 = h.dataset.tier;
      const any = [...document.querySelectorAll(`#ovBody tr.data-row[data-tier="${t2}"]`)].some(r=>r.style.display!=='none');
      h.style.display = any?'':'none';
    });
    countEl.textContent = shown+' of 15 bundles';
  }
  search.addEventListener('input', applyFilter);
  tierSel.addEventListener('change', applyFilter);
  statusSel.addEventListener('change', applyFilter);
  applyFilter();

  // sorting (within full list, preserving tier grouping)
  let sortState={};
  document.querySelectorAll('#ovTable th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sort;
      const dir = sortState[key]==='asc'?'desc':'asc';
      sortState={}; sortState[key]=dir;
      const body = document.getElementById('ovBody');
      const order=["1","2","3","3p"];
      let newHtml='';
      order.forEach(t=>{
        const header = body.querySelector(`tr.tier-row[data-tier="${t}"]`);
        newHtml += header.outerHTML;
        const rows = [...body.querySelectorAll(`tr.data-row[data-tier="${t}"]`)];
        rows.sort((a,b)=>{
          let va,vb;
          if(key==='n'){va=+a.dataset.n; vb=+b.dataset.n;}
          else if(key==='sku'){va=a.querySelector('.sku-link').textContent; vb=b.querySelector('.sku-link').textContent;}
          else {va=a.dataset[key]||''; vb=b.dataset[key]||'';}
          if(va<vb) return dir==='asc'?-1:1;
          if(va>vb) return dir==='asc'?1:-1;
          return 0;
        });
        rows.forEach(r=> newHtml+=r.outerHTML);
      });
      body.innerHTML=newHtml;
      applyFilter();
    });
  });

  // print: mark active panel
  window.addEventListener('beforeprint', ()=>{
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('print-me'));
    const active = document.querySelector('.panel.active');
    if(active) active.classList.add('print-me');
  });
}

render();
</script>
</body>
</html>
